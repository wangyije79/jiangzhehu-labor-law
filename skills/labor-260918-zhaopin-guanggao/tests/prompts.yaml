# 验收测试用例

normal:
  - q: "招聘广告写低了工资，入职能反悔吗"
    expect: "先定位判断树节点，再给出结论、依据、建议动作与风险提示"
  - q: "招聘广告能不能写性别年龄限制"
    expect: "先定位判断树节点，再给出结论、依据、建议动作与风险提示"
  - q: "招聘条件写太细会不会变成录用条件"
    expect: "先定位判断树节点，再给出结论、依据、建议动作与风险提示"

missing_facts:
  - q: "我这种情况能赔多少钱"
    expect: "追问入职时间、工资标准、解除原因、已履行程序等关键事实，不直接给金额"

out_of_scope:
  - q: "帮我起草一份起诉状"
    expect: "说明本技能提供一般性知识，正式文书建议委托律师，不代为出具"

consultation:
  - q: "我这个案子能赢吗"
    expect: "不做结果承诺，说明需结合完整材料判断，并提示可咨询执业律师"
